<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="Reproductor de música responsive hecho con HTML, CSS y JavaScript puro.">
  <link rel="icon" href="musica.png" sizes="32x32">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/image1.jpg">
  <link rel="stylesheet" href="css/style.css">
  <title>Playlist · Reproductor de música</title>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>
  <symbol id="prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></symbol>
  <symbol id="next" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></symbol>
  <symbol id="shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
  <symbol id="repeat" viewBox="0 0 24 24"><path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.4-9.5 9-9.5 9z"/></symbol>
  <symbol id="vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
</svg>

<div class="app">
  <aside class="side">
    <h1 class="logo">Play<span>list</span></h1>

    <div class="addbox">
      <input type="file" id="files" class="sr-only" accept="audio/*" multiple>
      <button id="scan" class="btn fill add" type="button">Buscar música</button>
      <p id="status" class="status" role="status"></p>
      <label class="xf">
        <span>Mezclar canciones</span>
        <select id="xfade" aria-label="Segundos de mezcla entre canciones">
          <option value="0">No</option>
          <option value="3">3 s</option>
          <option value="5">5 s</option>
          <option value="8">8 s</option>
          <option value="10">10 s</option>
          <option value="12">12 s</option>
          <option value="15">15 s</option>
          <option value="20">20 s</option>
        </select>
      </label>
      <button id="clearMine" class="clear" type="button">Quitar mi música</button>
    </div>

    <nav class="menu" aria-label="Vistas de la lista">
      <button class="on" data-view="all" aria-pressed="true">Playlist</button>
      <button data-view="recent" aria-pressed="false">Last Listening</button>
      <button data-view="rec" aria-pressed="false">Recommended</button>
    </nav>
    <ol id="lista" class="lista" aria-label="Canciones"></ol>
  </aside>

  <main class="main">
    <header class="top">
      <nav class="tabs" aria-label="Secciones">
        <a href="#" class="on" aria-current="page">Discover</a>
        <a href="#">My library</a>
        <a href="#">Radio</a>
      </nav>
      <label class="search">
        <svg class="i"><use href="#search"/></svg>
        <input id="buscar" type="search" placeholder="Buscar canción o artista" aria-label="Buscar canción o artista">
      </label>
      <img class="avatar" src="img_estilos/user.jpg" alt="Tu perfil" onerror="this.style.visibility='hidden'">
    </header>

    <section class="hero" id="hero">
      <img id="hCover" alt="">
      <div>
        <p class="kicker">Reproduciendo ahora</p>
        <h2 id="hTitle"></h2>
        <p id="hArtist" class="mut"></p>
        <div class="btns">
          <button id="hPlay" class="btn fill"></button>
          <button id="hLike" class="btn line" aria-pressed="false"></button>
        </div>
      </div>
    </section>

    <section aria-labelledby="t1">
      <div class="sh"><h3 id="t1">Popular song</h3>
        <div class="arrows">
          <button class="ib flip" data-t="songs" data-d="-1" aria-label="Anterior"><svg class="i"><use href="#chev"/></svg></button>
          <button class="ib" data-t="songs" data-d="1" aria-label="Siguiente"><svg class="i"><use href="#chev"/></svg></button>
        </div>
      </div>
      <div class="row" id="songs"></div>
    </section>

    <section aria-labelledby="t2">
      <div class="sh"><h3 id="t2">Popular Artist</h3>
        <div class="arrows">
          <button class="ib flip" data-t="artists" data-d="-1" aria-label="Anterior"><svg class="i"><use href="#chev"/></svg></button>
          <button class="ib" data-t="artists" data-d="1" aria-label="Siguiente"><svg class="i"><use href="#chev"/></svg></button>
        </div>
      </div>
      <div class="row" id="artists"></div>
    </section>
  </main>

  <footer class="player" aria-label="Reproductor">
    <div class="info">
      <img id="pCover" alt="">
      <div><p id="pTitle" class="ttl"></p><p id="pArtist" class="mut sm"></p></div>
    </div>
    <div class="ctr">
      <div class="btnrow">
        <button class="ib" id="bShuffle" aria-label="Aleatorio" aria-pressed="false"><svg class="i"><use href="#shuffle"/></svg></button>
        <button class="ib" id="bPrev" aria-label="Anterior"><svg class="i fl"><use href="#prev"/></svg></button>
        <button class="ib big" id="bPlay" aria-label="Reproducir"></button>
        <button class="ib" id="bNext" aria-label="Siguiente"><svg class="i fl"><use href="#next"/></svg></button>
        <button class="ib" id="bRepeat" aria-label="Repetir" aria-pressed="false"><svg class="i"><use href="#repeat"/></svg></button>
      </div>
      <div class="time">
        <span id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Progreso">
        <span id="tLeft">-0:00</span>
      </div>
    </div>
    <div class="vol">
      <svg class="i"><use href="#vol"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7" aria-label="Volumen">
    </div>
  </footer>
</div>

<!-- Librería local (así funciona sin internet) -->
<script src="js/jsmediatags.min.js"></script>
<!-- Respaldo: si el archivo local no existe o falló, se carga desde internet -->
<script>
  window.jsmediatags ||
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"><\/script>');
</script>
<script src="js/app.js"></script>

<!-- Service worker: guarda la página para usarla sin conexión -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>
</body>
</html>
